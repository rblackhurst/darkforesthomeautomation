name: Fix migrations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Copy fix script to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              infra/fix-duplicate-customers.py \
              "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/fix-duplicate-customers.py"

      - name: Deduplicate customers, migrate, restart
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" bash <<'ENDSSH'
          set -euo pipefail
          APP=/home/dfha/darkforesthomeautomation/app
          set -a; source "$APP/.env"; set +a
          PYTHON=$APP/.venv/bin/python
          MANAGE=$APP/manage.py

          echo "=== Applying migrations up to jobs 0024 ==="
          $PYTHON $MANAGE migrate jobs 0024 --verbosity=1

          echo ""
          echo "=== Deduplicating Customer emails ==="
          $PYTHON $MANAGE shell < /tmp/fix-duplicate-customers.py

          echo ""
          echo "=== Applying remaining migrations ==="
          $PYTHON $MANAGE migrate --verbosity=1

          echo ""
          echo "=== Restarting app ==="
          sudo DFHA_BRANCH=main /usr/local/bin/dfha-deploy
          ENDSSH
